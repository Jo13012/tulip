[package]
name = "polymarket_rust_service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6.1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
polymarket-client-sdk = { version = "0.3.3", features = ["gamma", "ws"] }

# Required for live.rs + privy_signer.rs
alloy = { version = "1.2.1", default-features = false, features = ["signer-local", "signers"] }
rust_decimal = { version = "1.39.0", features = ["serde"] }
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = { version = "0.10", features = [] }
